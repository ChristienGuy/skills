# skills.yaml — single source of truth for what this pack contains.
#
# `bootstrap` reads this file and runs `skillshare install --skill` for each entry.
# Float-on-main: omit `ref` to track the upstream's default branch.

# Authored skills under this repo's skills/ directory.
# Each name maps to skills/<name>/SKILL.md.
authored: []

# Curated upstream skills.
# Entries are skill **names** (frontmatter `name:` / leaf directory name) — never
# paths. Skillshare's --skill flag resolves names within the cloned repo regardless
# of nesting. If two skills in the same upstream ever collide on name, we'd need to
# revisit this scheme.
